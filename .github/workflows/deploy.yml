name: Publicar site

# Monta o editor a partir do projeto aberto LerSent001/orb (licença MIT)
# com as mudanças do Verdant Glass guardadas em site.patch.gz.b64,
# e publica no GitHub Pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar este repositório
        uses: actions/checkout@v7

      - name: Baixar o projeto original e aplicar as mudanças
        run: |
          git clone https://github.com/LerSent001/orb.git editor
          cd editor
          git checkout 8d1736e
          base64 -d ../site.patch.gz.b64 | gunzip | git apply

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Montar o site
        working-directory: editor
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm exec vite build

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: editor/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
